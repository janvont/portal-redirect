<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>

  <!-- SEO-friendly canonical -->
  <link rel="canonical" href="https://portal.janvont.com/">

  <!-- Fallback redirect -->
  <meta http-equiv="refresh" content="0; url=https://portal.janvont.com/">

  <!-- Primary redirect -->
  <script>
    window.location.replace("https://portal.janvont.com/");
  </script>
</head>
<body>
  <p>Přesměrovávám na <a href="https://portal.janvont.com/">portal.janvont.com</a>…</p>
</body>
</html>
